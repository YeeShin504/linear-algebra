name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  development:
    name: Test locked development environment (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install locked development dependencies
        run: |
          uv python install 3.14
          uv sync --locked --python 3.14

      - name: Run tests in locked development environment
        run: uv run --no-sync --python 3.14 pytest --doctest-modules tests/

  test:
    name: Run Tests on Multiple OS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python ${{ matrix.python-version }} -e . pytest pytest-cov ipython

      - name: Run tests with coverage
        run: |
          uv run --no-project --python ${{ matrix.python-version }} pytest --doctest-modules --cov=src --cov-branch --cov-report=xml tests/

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
