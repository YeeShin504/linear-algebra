name: Build and test TI-84 programs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .8xp files
        run: python3 tools/build.py

      - name: Check committed .8xp files are up to date
        run: git diff --exit-code -- bin/

      - name: Run programs in the TI-BASIC simulator
        run: python3 -m unittest discover -s tests -v
